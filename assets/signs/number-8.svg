<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460">
  <defs>
    <!-- Dark Studio Vignette Background -->
    <radialGradient id="studioBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Human Skin Gradients (Warm healthy melanin tones) -->
    <linearGradient id="skinPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0caa7" />
      <stop offset="30%" stop-color="#d49b72" />
      <stop offset="70%" stop-color="#b4744d" />
      <stop offset="100%" stop-color="#804728" />
    </linearGradient>

    <linearGradient id="skinSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eed0b3" />
      <stop offset="35%" stop-color="#ce956d" />
      <stop offset="75%" stop-color="#af6e47" />
      <stop offset="100%" stop-color="#7a4225" />
    </linearGradient>

    <!-- Palmar Pad Highlight -->
    <radialGradient id="palmarPad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f7d9bf" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d99f77" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#aa6943" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Keratin Nail Gradient -->
    <linearGradient id="nailPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f5ded2" />
      <stop offset="80%" stop-color="#e2b7a0" />
      <stop offset="100%" stop-color="#b87a55" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Subtle Edge Ambient Occlusion -->
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#542c16" flood-opacity="0.45" />
    </filter>

    <!-- Motion Indicator Marker -->
    <marker id="motionArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Clean Studio Backdrop -->
  <rect width="100%" height="100%" fill="url(#studioBg)" rx="20" />

  <!-- Subtle Studio Technical Guides -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.75">
    <line x1="60" y1="0" x2="60" y2="460" />
    <line x1="540" y1="0" x2="540" y2="460" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <circle cx="300" cy="230" r="170" fill="none" stroke-dasharray="4,4" />
  </g>

  <!-- Hand Demonstration Graphic Group -->
  <g id="hand-illustration" filter="url(#softShadow)">
    
      <!-- Forearm -->
      
      <g transform="rotate(0 300 320)">
        <!-- Arm Muscle Contour -->
        <path d="M 266.25 440 
                 C 258.75 380, 264 344, 268.5 320
                 L 331.5 320
                 C 336 344, 341.25 380, 333.75 440 Z" 
              fill="url(#skinPrimary)" stroke="#6e371b" stroke-width="1.4" />
        <!-- Wrist Crease Lines -->
        <path d="M 273.75 326 Q 300 332 326.25 326" stroke="#783e20" stroke-width="1.5" fill="none" opacity="0.7" />
        <path d="M 277.5 334 Q 300 338 322.5 334" stroke="#783e20" stroke-width="1.2" fill="none" opacity="0.5" />
      </g>
    

      <!-- Palm with Numeral badge -->
      <path d="M 265 320 C 255 270, 258 230, 268 200 C 280 190, 320 190, 332 200 C 342 230, 345 270, 335 320 Z" fill="url(#skinPrimary)" stroke="#6e371b" stroke-width="1.4" />
      <text x="300" y="260" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" opacity="0.85">8</text>

      <!-- Accurate Finger Extensions for Count -->
      
      <!-- Finger Phalanx Body -->
      <path d="M 252.05347166426967 199.225244065073 
               L 212.64714093968655 120.5117973178699 
               Q 218.6865024748416 110.10061182841442 224.72586400999666 114.08942633895893 
               L 267.94652833573036 190.774755934927 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="230.6024925591494" y1="155.81454152028928" 
            x2="243.95266016317638" y2="148.7161314909666" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="229.82980013765015" y1="152.82767921650665" 
            x2="241.90852320796026" y2="146.40530823759568" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="220.56438872598517" cy="120.83240219985012" rx="6.12" ry="8.1" 
               transform="rotate(-28 220.56438872598517 120.83240219985012)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
      <!-- Finger Phalanx Body -->
      <path d="M 265.3841245222114 197.60128617250024 
               L 239.12681853632245 103.15966673295759 
               Q 245.6748838994418 93.9826892418574 252.22294926256114 99.20571175075722 
               L 282.6158754777886 192.39871382749976 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="251.18385074335055" y1="145.58555946792177" 
            x2="265.6585215460354" y2="141.21539869812136" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="251.0060253907402" y1="142.50549808152556" 
            x2="264.1021561169789" y2="138.55154309932516" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="246.83101108721968" cy="105.01196723198568" rx="6.12" ry="8.1" 
               transform="rotate(-16.8 246.83101108721968 105.01196723198568)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
      <!-- Finger Phalanx Body -->
      <path d="M 279.0429534001635 195.87824609783235 
               L 272.6053494053191 108.08745583595145 
               Q 279.41270482119484 100.21998880159886 286.2200602370706 106.75252176724628 
               L 296.9570465998365 194.12175390216765 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="275.7530685077945" y1="147.56872056305852" 
            x2="290.80090679551984" y2="146.0932671187002" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="276.17688353650396" y1="144.51277867528643" 
            x2="289.79159436825546" y2="143.1778446065813" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="279.8030364202314" cy="111.40089840152619" rx="6.12" ry="8.1" 
               transform="rotate(-5.6000000000000005 279.8030364202314 111.40089840152619)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
      <!-- Finger Phalanx Body -->
      <path d="M 293.0429534001635 194.12175390216765 
               L 303.7799397629294 106.75252176724628 
               Q 310.58729517880516 100.21998880159886 317.3946505946809 108.08745583595145 
               L 310.9570465998365 195.87824609783235 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="299.19909320448016" y1="146.0932671187002" 
            x2="314.2469314922055" y2="147.56872056305852" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="300.20840563174454" y1="143.1778446065813" 
            x2="313.82311646349604" y2="144.51277867528643" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="310.1969635797686" cy="111.40089840152619" rx="6.12" ry="8.1" 
               transform="rotate(5.6000000000000005 310.1969635797686 111.40089840152619)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
      <!-- Finger Phalanx Body -->
      <path d="M 307.3841245222114 192.39871382749976 
               L 334.88673276799415 108.77890672607789 
               Q 341.4347981311135 103.55588421717808 347.98286349423284 112.73286170827826 
               L 324.6158754777886 197.60128617250024 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="322.75180357077" y1="146.48065593454774" 
            x2="337.22647437345483" y2="150.85081670434815" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="324.3081689998265" y1="143.81680033575157" 
            x2="337.4042997260652" y2="147.7707553179519" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="340.2786709433356" cy="114.58516220730635" rx="6.12" ry="8.1" 
               transform="rotate(16.8 340.2786709433356 114.58516220730635)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
    
  </g>

  <!-- ISL Verification Header Badge -->
  <g transform="translate(24, 28)">
    <rect width="112" height="26" rx="6" fill="#0b1329" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" />
    <text x="26" y="17" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ISL VERIFIED</text>
  </g>

  <!-- Label and Grammar Role -->
  <g transform="translate(576, 30)" text-anchor="end">
    <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">NUMBER "8"</text>
    <text y="18" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">ISL: NUMERAL SIGN</text>
  </g>
</svg>