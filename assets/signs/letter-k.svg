<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460">
  <defs>
    <!-- Dark Studio Vignette Background -->
    <radialGradient id="studioBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Human Skin Gradients (Warm healthy melanin tones) -->
    <linearGradient id="skinPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0caa7" />
      <stop offset="30%" stop-color="#d49b72" />
      <stop offset="70%" stop-color="#b4744d" />
      <stop offset="100%" stop-color="#804728" />
    </linearGradient>

    <linearGradient id="skinSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eed0b3" />
      <stop offset="35%" stop-color="#ce956d" />
      <stop offset="75%" stop-color="#af6e47" />
      <stop offset="100%" stop-color="#7a4225" />
    </linearGradient>

    <!-- Palmar Pad Highlight -->
    <radialGradient id="palmarPad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f7d9bf" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d99f77" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#aa6943" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Keratin Nail Gradient -->
    <linearGradient id="nailPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f5ded2" />
      <stop offset="80%" stop-color="#e2b7a0" />
      <stop offset="100%" stop-color="#b87a55" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Subtle Edge Ambient Occlusion -->
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#542c16" flood-opacity="0.45" />
    </filter>

    <!-- Motion Indicator Marker -->
    <marker id="motionArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Clean Studio Backdrop -->
  <rect width="100%" height="100%" fill="url(#studioBg)" rx="20" />

  <!-- Subtle Studio Technical Guides -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.75">
    <line x1="60" y1="0" x2="60" y2="460" />
    <line x1="540" y1="0" x2="540" y2="460" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <circle cx="300" cy="230" r="170" fill="none" stroke-dasharray="4,4" />
  </g>

  <!-- Hand Demonstration Graphic Group -->
  <g id="hand-illustration" filter="url(#softShadow)">
    
        <!-- Left Reference Hand -->
        
      <g transform="rotate(-18 210 315)">
        <!-- Arm Muscle Contour -->
        <path d="M 177.6 425 
                 C 170.4 370, 175.44 337, 179.76 315
                 L 240.24 315
                 C 244.56 337, 249.6 370, 242.4 425 Z" 
              fill="url(#skinSecondary)" stroke="#6e371b" stroke-width="1.4" />
        <!-- Wrist Crease Lines -->
        <path d="M 184.8 321 Q 210 327 235.2 321" stroke="#783e20" stroke-width="1.5" fill="none" opacity="0.7" />
        <path d="M 188.4 329 Q 210 333 231.6 329" stroke="#783e20" stroke-width="1.2" fill="none" opacity="0.5" />
      </g>
    
        <path d="M 180 280 C 175 235, 185 205, 240 205 C 260 205, 265 225, 260 280 Z" fill="url(#skinSecondary)" stroke="#6e371b" stroke-width="1.4" />
        
      <!-- Finger Phalanx Body -->
      <path d="M 181.19667159339576 206.87120521735983 
               L 165.63697669147123 123.27956990281999 
               Q 172.32750628049047 114.65745393762651 179.0180358695097 120.43533797243305 
               L 198.80332840660424 203.12879478264017 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="172.88533259272216" y1="160.84341204827683" 
            x2="187.67492431581732" y2="157.6997872831123" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="172.96586379279722" y1="157.75927282868662" 
            x2="186.3469229708357" y2="154.91504089829965" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="173.1591530437615" cy="125.77004434056174" rx="6.12" ry="8.1" 
               transform="rotate(-12 173.1591530437615 125.77004434056174)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
        
      <!-- Finger Phalanx Body -->
      <path d="M 200.52314152253166 200.66268650056918 
               L 196.17072255143216 105.73505696574928 
               Q 203.3731349943081 97.6314152253167 210.575547437184 104.72777348488411 
               L 219.47685847746834 199.33731349943082 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="198.39466312579606" y1="148.4339350344023" 
            x2="214.31578536794285" y2="147.32062171344606" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="198.94354238276117" y1="145.3882279635773" 
            x2="213.34836726851302" y2="144.38094448271212" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="203.6521608892846" cy="109.221671426356" rx="6.460000000000001" ry="8.55" 
               transform="rotate(-4 203.6521608892846 109.221671426356)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
        
      <!-- Finger Phalanx Body -->
      <path d="M 221.02192354766157 201.37219173630288 
               L 229.31523158570585 113.73722929672566 
               Q 236.13856968948303 107.01436357713547 242.96190779326022 114.69149785754529 
               L 238.97807645233843 202.62780826369712 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="225.83462910925138" y1="153.19054102591892" 
            x2="240.91779754917994" y2="154.24525890893008" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="226.76214464667083" y1="150.2480735362352" 
            x2="240.4088208542252" y2="151.20234209705484" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="235.85954379450652" cy="118.20461977817477" rx="6.12" ry="8.1" 
               transform="rotate(4 235.85954379450652 118.20461977817477)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
        <!-- Extended Left Thumb -->
        <path d="M 185 245 C 160 235, 145 205, 155 190 C 165 180, 180 195, 190 220 Z" fill="url(#skinSecondary)" stroke="#6e371b" stroke-width="1.3" />

        <!-- Right Articulating Hand -->
        
      <g transform="rotate(18 390 315)">
        <!-- Arm Muscle Contour -->
        <path d="M 357.6 425 
                 C 350.4 370, 355.44 337, 359.76 315
                 L 420.24 315
                 C 424.56 337, 429.6 370, 422.4 425 Z" 
              fill="url(#skinPrimary)" stroke="#6e371b" stroke-width="1.4" />
        <!-- Wrist Crease Lines -->
        <path d="M 364.8 321 Q 390 327 415.2 321" stroke="#783e20" stroke-width="1.5" fill="none" opacity="0.7" />
        <path d="M 368.4 329 Q 390 333 411.6 329" stroke="#783e20" stroke-width="1.2" fill="none" opacity="0.5" />
      </g>
    
        <path d="M 420 280 C 425 235, 415 205, 360 205 C 340 205, 335 225, 340 280 Z" fill="url(#skinPrimary)" stroke="#6e371b" stroke-width="1.4" />

        
          <circle cx="300" cy="210" r="48" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5" />
          <text x="300" y="226" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" opacity="0.3">K</text>
          
      <!-- Finger Phalanx Body -->
      <path d="M 333.2824855787278 221.7175144212722 
               L 272.66929229541694 157.8799142157507 
               Q 277.7746032555838 145.17460325558383 282.8799142157507 147.66929229541697 
               L 346.7175144212722 208.2824855787278 Z" 
            fill="url(#skinPrimary)" stroke="#743c1f" stroke-width="1.2" />

      <!-- Joint Crease Rings (PIP & DIP Knuckle Folds) -->
      <line x1="300.13331967670246" y1="186.41874390443974" 
            x2="311.41874390443974" y2="175.13331967670246" 
            stroke="#65331a" stroke-width="1.4" opacity="0.75" />
      <line x1="298.54940048684455" y1="183.76002240717833" 
            x2="308.7600224071783" y2="173.5494004868446" 
            stroke="#65331a" stroke-width="1.0" opacity="0.6" />

      
      <!-- Fingernail Plate -->
      <ellipse cx="280.60303038033004" cy="155.60303038033" rx="6.460000000000001" ry="8.55" 
               transform="rotate(-45 280.60303038033004 155.60303038033)" 
               fill="url(#nailPlate)" stroke="#8d5130" stroke-width="0.8" />
      
    
        
      
  </g>

  <!-- ISL Verification Header Badge -->
  <g transform="translate(24, 28)">
    <rect width="112" height="26" rx="6" fill="#0b1329" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" />
    <text x="26" y="17" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ISL VERIFIED</text>
  </g>

  <!-- Label and Grammar Role -->
  <g transform="translate(576, 30)" text-anchor="end">
    <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">LETTER "K"</text>
    <text y="18" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">ISL: TWO-HANDED MANUAL ALPHABET</text>
  </g>
</svg>