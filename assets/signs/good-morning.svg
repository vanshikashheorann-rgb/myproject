        <!-- Motion Arc -->
        <path d="M 250 170 Q 300 135 350 170" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-dasharray="4,4" marker-end="url(#motionArrow)" opacity="0.85" />

